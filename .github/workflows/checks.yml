# Runs the site's checks (src/README.md, "Checks") on every push and pull request, and on demand from the Actions tab.
# "Build and data" rebuilds index.html from src/ and compares it with the one committed, then runs the checks that need no
# browser. "Clubhouse database" tests src/account/club.sql and club-live.sql on PostgreSQL, then the page against them (live
# rooms with three students on a stand-in for Supabase Realtime). The browser checks run in three groups at once.
# A red run means a change broke something the checks cover; the failing step's log names the check. Nothing here
# deploys: GitHub Pages still publishes main as it is.
name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Python packages
        run: pip install sympy==1.14.0
      - name: index.html is built from the sources
        run: |
          python3 -I src/site/assemble.py "$RUNNER_TEMP/page.html"
          python3 -I src/site/make_index.py "$RUNNER_TEMP/page.html" "$RUNNER_TEMP/index.html"
          cmp -s "$RUNNER_TEMP/index.html" index.html || { echo "::error::index.html is not a fresh build of src/. Rebuild it (src/README.md) and commit it."; exit 1; }
          cmp -s "$RUNNER_TEMP/catalog.json" catalog.json || { echo "::error::catalog.json is not a fresh build of src/site/prizes.js. Rebuild index.html (src/README.md), which writes it too, and commit both."; exit 1; }
      - name: The page's script parses
        run: node --check src/site/bundle.js
      - name: Each name at the top of the page's script is declared once
        run: node --expose-internals src/check/names.js
      - name: Theme colors are readable and their CSS is up to date
        run: |
          cp src/site/app.css "$RUNNER_TEMP/app.css"
          python3 -I src/tools/themes.py "$RUNNER_TEMP/app.css"
          cmp -s "$RUNNER_TEMP/app.css" src/site/app.css || { echo "::error::The theme block in app.css is out of date: run src/tools/themes.py on it."; exit 1; }
          python3 -I src/tools/themes.py --prizes "$RUNNER_TEMP/prize-themes.css"
          cmp -s "$RUNNER_TEMP/prize-themes.css" src/site/prize-themes.css || { echo "::error::prize-themes.css is out of date: run src/tools/themes.py --prizes."; exit 1; }
          cp src/site/fx.js "$RUNNER_TEMP/fx.js"
          python3 -I src/tools/themes.py --fxpal "$RUNNER_TEMP/fx.js"
          cmp -s "$RUNNER_TEMP/fx.js" src/site/fx.js || { echo "::error::The theme colors in fx.js (FX_PAL) are out of date: run src/tools/themes.py --fxpal src/site/fx.js."; exit 1; }
      - name: Generated Math lists are up to date
        run: |
          python3 -I src/math/notin.py
          python3 -I src/math/shortcut_first.py
          git diff --exit-code -- src/build || { echo "::error::A file in src/build changed when rebuilt; commit the rebuilt file."; exit 1; }
      - name: Study pack coverage
        run: python3 src/check/study_coverage.py
      - name: Study method lines
        run: python3 -I src/math/study_text.py --check
      - name: Math drill cards
        run: python3 -I src/check/mdrills_check.py
      - name: Reading and Writing practice records
        run: node src/check/rw-practice.js
      - name: Link previews
        run: python3 -I src/check/head.py index.html

  database:
    name: Clubhouse database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15  # the oldest PostgreSQL a Supabase project still runs
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - name: club.sql does what the page counts on
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: sh src/check/club-db.sh
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: the page with club.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: node src/check/club.js index.html 390
      - name: live rooms with three students
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: node src/check/live.js index.html 390

  browser:
    name: Browser checks (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: accounts, prizes, rooms, visits and challenges
            checks: account prizes room visits challenge buddy
          - group: pages and practice
            checks: additions habit smoke nav msmoke
          - group: tracks, text and sources
            checks: rwtrack text plan symbols mtrack suggest qtext skip source-review
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # symbols.js serves the site as it was at two older commits
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Playwright and Chromium
        run: |
          npm install --global playwright@1.63.0  # some checks load it from the global folder (npm root -g)
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Run the checks
        env:
          CHECKS: ${{ matrix.checks }}
        run: |
          failed=""
          for c in $CHECKS; do
            case $c in
              symbols|suggest|skip|visits|buddy) args="index.html" ;;
              msmoke) args="index.html 390 light" ;;
              text) args="index.html $RUNNER_TEMP/text-dump.txt" ;;
              *) args="index.html 390" ;;
            esac
            echo "::group::$c"
            if [ "$c" = source-review ]; then
              python3 -m http.server 8000 --bind 127.0.0.1 > /dev/null 2>&1 &
              srv=$!
              sleep 1
              CHROMIUM_EXECUTABLE="$(node -e "console.log(require('playwright').chromium.executablePath())")" node src/check/source-review.js http://127.0.0.1:8000/ || failed="$failed $c"
              kill "$srv"
            else
              node "src/check/$c.js" $args || failed="$failed $c"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "::error::Failed:$failed"; exit 1; fi
          echo "All passed: $CHECKS"
